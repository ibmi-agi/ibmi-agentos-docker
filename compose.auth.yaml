# =============================================================================
# Optional multi-user MCP auth overlay
# =============================================================================
#
# Apply with:
#   docker compose -f compose.yaml -f compose.auth.yaml up -d
#
# Prerequisites:
#   1. Generate RSA keys:                bash scripts/generate_mcp_keys.sh
#   2. Set AUTH_MASTER_KEY in .env:      openssl rand -hex 32
#   3. Set AUTH_ENCRYPTION_KEY in .env:  openssl rand -hex 32
#
# See docs/auth-optional.md for the full walkthrough.
# =============================================================================

services:
  agentos-api:
    environment:
      AUTH_ENABLED: "true"
      AUTH_MASTER_KEY: ${AUTH_MASTER_KEY:-}
      AUTH_ENCRYPTION_KEY: ${AUTH_ENCRYPTION_KEY:-}
      MCP_AUTH_MODE: "ibmi"
      IBMI_HTTP_AUTH_ENABLED: "true"

  ibmi-mcp-server:
    environment:
      MCP_AUTH_MODE: ibmi
      IBMI_HTTP_AUTH_ENABLED: "true"
      IBMI_AUTH_KEY_ID: ${IBMI_AUTH_KEY_ID:-ibmi-agentos}
      IBMI_AUTH_PRIVATE_KEY_PATH: /secrets/private.pem
      IBMI_AUTH_PUBLIC_KEY_PATH: /secrets/public.pem
      IBMI_AUTH_ALLOW_HTTP: ${IBMI_AUTH_ALLOW_HTTP:-true}
      IBMI_AUTH_TOKEN_EXPIRY_SECONDS: ${IBMI_AUTH_TOKEN_EXPIRY_SECONDS:-3600}
      IBMI_AUTH_MAX_CONCURRENT_SESSIONS: ${IBMI_AUTH_MAX_CONCURRENT_SESSIONS:-100}
    volumes:
      - ./secrets:/secrets:ro
