# IBM i SAMPLE Library Tools
# Schema-discovery tools + employee/department/project tools for the
# Db2 for i SAMPLE library shipped with every IBM i system.
#
# The employee-info tools are ported verbatim from the upstream canonical
# YAML so the upstream remains a visible reference point:
#   https://github.com/IBM/ibmi-mcp-server/blob/main/tools/sample/employee-info.yaml

sources:
  ibmi-sample:
    host: ${DB2i_HOST}
    user: ${DB2i_USER}
    password: ${DB2i_PASS}
    port: 8076
    ignore-unauthorized: true

tools:
  # ─── Schema discovery (custom) ────────────────────────────────────────────

  list_sample_tables:
    source: ibmi-sample
    description: |
      List all tables, views, and physical files in the SAMPLE library
      with their text descriptions and object types. Use this first when
      you need to know which objects are available in SAMPLE before
      writing a query.
    statement: |
      SELECT TABLE_NAME, TABLE_TEXT, TABLE_TYPE
      FROM QSYS2.SYSTABLES
      WHERE TABLE_SCHEMA = 'SAMPLE'
      ORDER BY TABLE_NAME
    responseFormat: markdown
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "discovery"
      title: "List SAMPLE Tables"

  describe_sample_table:
    source: ibmi-sample
    description: |
      Describe the columns of a table in the SAMPLE library: name, data
      type, length, numeric scale, nullability, column text, and ordinal
      position. Pass the unqualified table name (e.g., 'EMPLOYEE'). Use
      this before writing any column-referencing SQL against a SAMPLE
      table.
    statement: |
      SELECT COLUMN_NAME,
             DATA_TYPE,
             LENGTH,
             NUMERIC_SCALE,
             IS_NULLABLE,
             COLUMN_TEXT,
             ORDINAL_POSITION
      FROM QSYS2.SYSCOLUMNS
      WHERE TABLE_SCHEMA = 'SAMPLE'
        AND TABLE_NAME = UPPER(:table_name)
      ORDER BY ORDINAL_POSITION
    parameters:
      - name: table_name
        type: string
        description: "Unqualified table name in the SAMPLE library (e.g., 'EMPLOYEE')"
        required: true
        pattern: "^[A-Z_][A-Z0-9_]*$"
    responseFormat: markdown
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "discovery"
      title: "Describe SAMPLE Table"

  list_sample_relationships:
    source: ibmi-sample
    description: |
      List foreign-key relationships defined in the SAMPLE library:
      constraint name, child table/column, referenced parent table/column,
      and the delete/update rules. Use this to understand how SAMPLE
      tables join before writing multi-table queries.
    statement: |
      SELECT R.CONSTRAINT_NAME,
             K.TABLE_NAME,
             K.COLUMN_NAME,
             PK.TABLE_NAME      AS REFERENCED_TABLE_NAME,
             PK.COLUMN_NAME     AS REFERENCED_COLUMN_NAME,
             R.DELETE_RULE,
             R.UPDATE_RULE
      FROM QSYS2.SYSREFCST R
      JOIN QSYS2.SYSKEYCST K
        ON R.CONSTRAINT_SCHEMA = K.CONSTRAINT_SCHEMA
       AND R.CONSTRAINT_NAME   = K.CONSTRAINT_NAME
      JOIN QSYS2.SYSKEYCST PK
        ON R.UNIQUE_CONSTRAINT_SCHEMA = PK.CONSTRAINT_SCHEMA
       AND R.UNIQUE_CONSTRAINT_NAME   = PK.CONSTRAINT_NAME
       AND K.ORDINAL_POSITION         = PK.ORDINAL_POSITION
      WHERE R.CONSTRAINT_SCHEMA = 'SAMPLE'
      ORDER BY K.TABLE_NAME, R.CONSTRAINT_NAME, K.ORDINAL_POSITION
    responseFormat: markdown
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "discovery"
      title: "List SAMPLE Relationships"

  # ─── Employee info (ported verbatim from upstream employee-info.yaml) ─────

  get_employee_details:
    source: ibmi-sample
    description: Retrieve detailed information about an employee including department and manager
    statement: |
      SELECT
        E.EMPNO,
        E.FIRSTNME,
        E.MIDINIT,
        E.LASTNAME,
        E.JOB,
        E.HIREDATE,
        E.SALARY,
        E.BONUS,
        E.WORKDEPT,
        D.DEPTNAME,
        D.LOCATION,
        M.FIRSTNME AS MGR_FIRSTNME,
        M.LASTNAME AS MGR_LASTNAME
      FROM SAMPLE.EMPLOYEE E
      LEFT JOIN SAMPLE.DEPARTMENT D ON E.WORKDEPT = D.DEPTNO
      LEFT JOIN SAMPLE.EMPLOYEE M ON D.MGRNO = M.EMPNO
      WHERE E.EMPNO = :employee_id
    parameters:
      - name: employee_id
        type: string
        description: "Employee ID (e.g., '000010') - Must be 6 digits"
        required: true
        pattern: "^[0-9]{6}$"
    responseFormat: markdown
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "employee-info"
      title: "Get Employee Details"

  find_employees_by_department:
    source: ibmi-sample
    description: List employees in a specific department
    statement: |
      SELECT
        E.EMPNO,
        E.FIRSTNME,
        E.MIDINIT,
        E.LASTNAME,
        E.JOB,
        E.HIREDATE,
        E.SALARY
      FROM SAMPLE.EMPLOYEE E
      WHERE E.WORKDEPT = :department_id
      ORDER BY E.LASTNAME, E.FIRSTNME
    parameters:
      - name: department_id
        type: string
        description: "Department ID - Select from predefined departments"
        required: true
        enum: ["A00", "B01", "C01", "D01", "E01"]
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "employee-info"
      title: "Find Employees by Department"

  find_employees_by_job:
    source: ibmi-sample
    description: Find employees with a specific job title
    statement: |
      SELECT
        E.EMPNO,
        E.FIRSTNME,
        E.MIDINIT,
        E.LASTNAME,
        E.WORKDEPT,
        D.DEPTNAME,
        E.HIREDATE,
        E.SALARY
      FROM SAMPLE.EMPLOYEE E
      LEFT JOIN SAMPLE.DEPARTMENT D ON E.WORKDEPT = D.DEPTNO
      WHERE E.JOB = :job_title
      ORDER BY E.LASTNAME, E.FIRSTNME
    parameters:
      - name: job_title
        type: string
        description: "Job title - Select from common job titles"
        required: true
        enum: ["MANAGER", "ANALYST", "DESIGNER", "CLERK", "SALESREP", "PRES"]
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "employee-info"
      title: "Find Employees by Job Title"

  get_employee_projects:
    source: ibmi-sample
    description: List projects an employee is working on
    statement: |
      SELECT
        P.PROJNO,
        P.PROJNAME,
        A.ACTNO,
        A.ACTDESC,
        EPA.EMSTDATE AS START_DATE,
        EPA.EMENDATE AS END_DATE,
        EPA.EMPTIME
      FROM SAMPLE.EMPPROJACT EPA
      JOIN SAMPLE.PROJECT P ON EPA.PROJNO = P.PROJNO
      JOIN SAMPLE.PROJACT PA ON EPA.PROJNO = PA.PROJNO AND EPA.ACTNO = PA.ACTNO
      JOIN SAMPLE.ACT A ON EPA.ACTNO = A.ACTNO
      WHERE EPA.EMPNO = :employee_id
      AND (:include_completed = 1 OR EPA.EMENDATE IS NULL)
      ORDER BY EPA.EMSTDATE DESC
    parameters:
      - name: employee_id
        type: string
        description: "Employee ID (e.g., '000010') - Must be 6 digits"
        required: true
        pattern: "^[0-9]{6}$"
      - name: include_completed
        type: boolean
        description: "Include completed projects (true) or only active projects (false)"
        default: true
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "project-assignments"
      title: "Get Employee Projects"

  get_department_salary_stats:
    source: ibmi-sample
    description: Salary statistics by department with optional salary range filter
    statement: |
      SELECT
        D.DEPTNO,
        D.DEPTNAME,
        COUNT(E.EMPNO) AS EMPLOYEE_COUNT,
        AVG(E.SALARY) AS AVG_SALARY,
        MIN(E.SALARY) AS MIN_SALARY,
        MAX(E.SALARY) AS MAX_SALARY,
        SUM(E.SALARY) AS TOTAL_SALARY
      FROM SAMPLE.DEPARTMENT D
      LEFT JOIN SAMPLE.EMPLOYEE E ON D.DEPTNO = E.WORKDEPT
      WHERE (D.DEPTNO = :department_id OR :department_id = '*ALL')
      AND (E.SALARY >= :min_salary OR :min_salary IS NULL)
      AND (E.SALARY <= :max_salary OR :max_salary IS NULL)
      GROUP BY D.DEPTNO, D.DEPTNAME
      ORDER BY D.DEPTNO
    parameters:
      - name: department_id
        type: string
        description: "Department ID (e.g., 'A00') or '*ALL' for all departments"
        default: "*ALL"
      - name: min_salary
        type: integer
        description: "Minimum salary filter (optional)"
        min: 0
        max: 100000
        default: 0
      - name: max_salary
        type: integer
        description: "Maximum salary filter (optional)"
        min: 0
        max: 100000
        default: 100000
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "salary-analysis"
      title: "Department Salary Statistics"

  find_project_team_members:
    enabled: true
    source: ibmi-sample
    description: Find all employees working on specific projects. Accepts a JSON array of project IDs.
    statement: |
      SELECT
        E.EMPNO,
        E.FIRSTNME,
        E.MIDINIT,
        E.LASTNAME,
        E.JOB,
        E.WORKDEPT,
        D.DEPTNAME,
        EPA.PROJNO,
        EPA.EMSTDATE AS PROJECT_START_DATE,
        EPA.EMENDATE AS PROJECT_END_DATE,
        EPA.EMPTIME AS TIME_ALLOCATION
      FROM SAMPLE.EMPPROJACT EPA
      JOIN SAMPLE.EMPLOYEE E ON EPA.EMPNO = E.EMPNO
      LEFT JOIN SAMPLE.DEPARTMENT D ON E.WORKDEPT = D.DEPTNO
      WHERE EPA.PROJNO IN (:project_ids)
      ORDER BY EPA.PROJNO, E.LASTNAME, E.FIRSTNME
    parameters:
      - name: project_ids
        type: array
        itemType: string
        description: "Array of project IDs to search for. Must be a JSON array, not a string. Example: [\"MA2100\", \"AD3100\", \"AD3110\"]"
        required: true
        minLength: 1
        maxLength: 10
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "project-assignments"
      title: "Find Project Team Members"

  calculate_employee_bonus:
    source: ibmi-sample
    description: Calculate potential bonus for an employee based on performance rating and salary
    statement: |
      SELECT
        E.EMPNO,
        E.FIRSTNME,
        E.LASTNAME,
        E.SALARY,
        E.SALARY * :performance_multiplier AS CALCULATED_BONUS
      FROM SAMPLE.EMPLOYEE E
      WHERE E.EMPNO = :employee_id
    parameters:
      - name: employee_id
        type: string
        description: "Employee ID (e.g., '000010')"
        required: true
        pattern: "^[0-9]{6}$"
      - name: performance_multiplier
        type: float
        description: "Performance rating multiplier (0.0-0.3)"
        required: true
        min: 0.0
        max: 0.3
        default: 0.1
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "salary-analysis"
      title: "Calculate Employee Bonus"

  search_employees:
    source: ibmi-sample
    description: Search for employees by name with pagination
    statement: |
      SELECT
        E.EMPNO,
        E.FIRSTNME,
        E.MIDINIT,
        E.LASTNAME,
        E.JOB,
        E.WORKDEPT,
        D.DEPTNAME
      FROM SAMPLE.EMPLOYEE E
      LEFT JOIN SAMPLE.DEPARTMENT D ON E.WORKDEPT = D.DEPTNO
      WHERE UPPER(E.FIRSTNME) LIKE UPPER('%' || :name_search || '%')
      OR UPPER(E.LASTNAME) LIKE UPPER('%' || :name_search || '%')
      ORDER BY E.LASTNAME, E.FIRSTNME
      LIMIT :page_size OFFSET (:page_number - 1) * :page_size
    parameters:
      - name: name_search
        type: string
        description: "Name to search for (partial match)"
        required: true
        minLength: 2
      - name: page_size
        type: integer
        description: "Number of results per page"
        default: 10
        min: 1
        max: 100
      - name: page_number
        type: integer
        description: "Page number (starting from 1)"
        default: 1
        min: 1
    security:
      readOnly: true
    annotations:
      readOnlyHint: true
      idempotentHint: true
      domain: "sample"
      category: "employee-info"
      title: "Search Employees"

toolsets:
  sample_data:
    title: "SAMPLE Data"
    description: "Schema discovery + employee data for the Db2 for i SAMPLE library"
    tools:
      - list_sample_tables
      - describe_sample_table
      - list_sample_relationships
      - get_employee_details
      - find_employees_by_department
      - find_employees_by_job
      - get_employee_projects
      - get_department_salary_stats
      - find_project_team_members
      - calculate_employee_bonus
      - search_employees

metadata:
  version: "1.0.0"
  description: "SAMPLE library tools — schema discovery + employee-info (upstream-aligned)"
  domain: "sample"
  category: "data-access"
