# sources:
#   ibmi-system:
#     host: ${DB2i_HOST}
#     user: ${DB2i_USER}
#     password: ${DB2i_PASS}
#     port: 8076
#     ignore-unauthorized: true

tools:
  list_service_categories:
    source: ibmi-system
    description: |
      Summarize all SQL Service categories with service counts.
      Starting point for exploring available IBM i services. Returns
      category name and count, sorted by highest count. Use before
      list_services_by_category to pick a category to drill into.
    statement: |-
      SELECT service_category,
             COUNT(*) AS service_count
      FROM qsys2.services_info
      GROUP BY service_category
      ORDER BY service_count DESC, service_category
    domain: sysadmin
    category: discovery
    metadata:
      title: Service categories and counts

  list_services_by_category:
    source: ibmi-system
    description: |
      Browse all services within a specific category (e.g., Work
      Management, Security, Performance). Returns schema, name,
      SQL object type, and release info. Unlike search_services_by_name
      (keyword search), this is category-based exploration. Category
      must be an exact match from list_service_categories — use that
      tool first to get valid category names.
    statement: |-
      SELECT service_schema_name,
             service_name,
             sql_object_type,
             object_type,
             system_object_name,
             earliest_possible_release,
             latest_db2_group_level,
             initial_db2_group_level
      FROM qsys2.services_info
      WHERE service_category = :category
      ORDER BY service_schema_name, service_name
    parameters:
      - name: category
        type: string
        description: Exact value of SERVICE_CATEGORY to filter by.
        required: true
    domain: sysadmin
    category: browse
    metadata:
      title: Services by category

  search_services_by_name:
    source: ibmi-system
    description: |
      Find SQL Services by keyword in the service name. Uses
      case-insensitive LIKE '%keyword%' matching — partial names
      work (e.g., 'JOB' finds ACTIVE_JOB_INFO, JOB_INFO, etc.).
      Unlike where_is_service (exact name lookup), this is for
      discovery when you don't know the full name. Use first to
      find candidates, then get_service_example for usage details.
    statement: |-
      SELECT service_category,
             service_schema_name,
             service_name,
             sql_object_type,
             earliest_possible_release
      FROM qsys2.services_info
      WHERE UPPER(service_name) LIKE UPPER('%' CONCAT :name_contains CONCAT '%')
      ORDER BY service_category, service_schema_name, service_name
    parameters:
      - name: name_contains
        type: string
        description: Substring to search for in SERVICE_NAME.
        required: true
        minLength: 2
    domain: sysadmin
    category: search
    metadata:
      title: Search services by name

  list_services_by_schema:
    source: ibmi-system
    description: |
      Explore all services provided by a specific schema (library).
      Returns category, name, SQL object type, and release info.
      Unlike list_services_by_category (category-based), this groups
      by schema — useful for answering "What can I do with QSYS2?"
      Most services live in QSYS2; SYSTOOLS has utility functions.
    statement: |-
      SELECT service_category,
             service_name,
             sql_object_type,
             earliest_possible_release
      FROM qsys2.services_info
      WHERE service_schema_name = UPPER(:schema_name)
      ORDER BY service_category, service_name
    parameters:
      - name: schema_name
        type: string
        description: Schema name (library), e.g., QSYS2 or SYSTOOLS.
        required: true
        minLength: 1
    domain: sysadmin
    category: browse
    metadata:
      title: Services by schema

  list_services_by_sql_object_type:
    source: ibmi-system
    description: |
      Find services by SQL implementation type (VIEW, PROCEDURE,
      TABLE FUNCTION, SCALAR FUNCTION, TABLE). TABLE FUNCTIONs are
      the most useful for querying (parameterized, tabular output).
      SCALAR FUNCTIONs are typically helpers used inside other
      queries. Use to find all services of a specific type.
    statement: |-
      SELECT service_category,
             service_schema_name,
             service_name,
             sql_object_type,
             earliest_possible_release
      FROM qsys2.services_info
      WHERE sql_object_type = :sql_object_type
      ORDER BY service_category, service_schema_name, service_name
    parameters:
      - name: sql_object_type
        type: string
        description: SQL object type to filter by.
        required: true
        enum: ["VIEW", "PROCEDURE", "SCALAR FUNCTION", "TABLE FUNCTION", "TABLE"]
    domain: sysadmin
    category: browse
    metadata:
      title: Services by SQL object type

  get_service_example:
    source: ibmi-system
    description: |
      Get the complete example SQL for a specific service. Unlike
      search_examples_for_keyword (which returns 300-char snippets),
      this returns the full example text. Some services have no
      example — result will be NULL. Requires exact schema and
      service name; use search_services_by_name first if unsure of
      the exact name.
    statement: |-
      SELECT service_schema_name,
             service_name,
             example
      FROM qsys2.services_info
      WHERE service_schema_name = UPPER(:schema_name)
        AND service_name = UPPER(:service_name)
    parameters:
      - name: schema_name
        type: string
        description: Schema name containing the service (e.g., QSYS2).
        required: true
      - name: service_name
        type: string
        description: Exact SERVICE_NAME (case-insensitive match used).
        required: true
    domain: sysadmin
    category: reference
    metadata:
      title: Get service example

  where_is_service:
    source: ibmi-system
    description: |
      Locate a specific SQL Service by exact name and return its
      schema, category, SQL object type, and release info. Unlike
      search_services_by_name (partial keyword match), this requires
      the exact service name but is case-insensitive. Use when you
      know the service name and need to find which schema provides
      it and its object type.
    statement: |-
      SELECT service_category,
             service_schema_name,
             service_name,
             sql_object_type,
             object_type,
             system_object_name,
             earliest_possible_release
      FROM qsys2.services_info
      WHERE UPPER(service_name) = UPPER(:service_name)
      ORDER BY service_schema_name
    parameters:
      - name: service_name
        type: string
        description: Exact SERVICE_NAME to locate.
        required: true
    domain: sysadmin
    category: search
    metadata:
      title: Where is this service?

  search_examples_for_keyword:
    source: ibmi-system
    description: |
      Find services whose example SQL contains a keyword or phrase.
      Case-insensitive search across all service examples. Returns
      only the first 300 characters of each example — use
      get_service_example for the full text. Useful for finding
      learning examples (e.g., search 'AUTHORITY' to find services
      with security-related example SQL).
    statement: |-
      SELECT service_category,
             service_schema_name,
             service_name,
             SUBSTR(example, 1, 300) AS example_snippet
      FROM qsys2.services_info
      WHERE example IS NOT NULL
        AND UPPER(example) LIKE UPPER('%' CONCAT :keyword CONCAT '%')
      ORDER BY service_category, service_schema_name, service_name
    parameters:
      - name: keyword
        type: string
        description: Keyword or phrase to search for within EXAMPLE text.
        required: true
        minLength: 2
    domain: sysadmin
    category: search
    metadata:
      title: Search examples for keyword

  count_services_by_schema:
    source: ibmi-system
    description: |
      Count SQL Services by schema (library) to see which system
      libraries provide services. QSYS2 and SYSTOOLS are the primary
      providers. Use to discover which schema to explore further
      with list_services_by_schema.
    statement: |-
      SELECT service_schema_name,
             COUNT(*) AS service_count
      FROM qsys2.services_info
      GROUP BY service_schema_name
      ORDER BY service_count DESC, service_schema_name
    domain: sysadmin
    category: discovery
    metadata:
      title: Service counts by schema

  count_services_by_sql_object_type:
    source: ibmi-system
    description: |
      Categorize services by SQL object type (VIEW, PROCEDURE,
      TABLE FUNCTION, SCALAR FUNCTION, TABLE). TABLE FUNCTIONs
      are the most common high-value services (ACTIVE_JOB_INFO,
      OBJECT_STATISTICS, etc.). VIEWs are simpler read-only queries.
      Use to understand the implementation landscape of available
      services.
    statement: |-
      SELECT sql_object_type,
             COUNT(*) AS service_count
      FROM qsys2.services_info
      GROUP BY sql_object_type
      ORDER BY service_count DESC, sql_object_type
    domain: sysadmin
    category: discovery
    metadata:
      title: Service counts by SQL object type

  list_categories_for_schema:
    source: ibmi-system
    description: |
      Show which service categories exist within a specific schema.
      Use to explore a single schema's capabilities (e.g., 'What
      troubleshooting services does QSYS2 provide?'). Complement to
      list_service_categories which shows categories across all
      schemas.
    statement: |-
      SELECT service_schema_name,
             service_category,
             COUNT(*) AS service_count
      FROM qsys2.services_info
      WHERE service_schema_name = UPPER(:schema_name)
      GROUP BY service_schema_name, service_category
      ORDER BY service_count DESC, service_category
    parameters:
      - name: schema_name
        type: string
        description: Schema name to summarize (e.g., QSYS2).
        required: true
    domain: sysadmin
    category: discovery
    metadata:
      title: Categories within a schema

toolsets:
  sysadmin_discovery:
    title: Sys Admin Discovery
    description: High-level summaries and counts for services.
    tools:
      - list_service_categories
      - count_services_by_schema
      - count_services_by_sql_object_type
      - list_categories_for_schema

  sysadmin_browse:
    title: Sys Admin Browse
    description: Explore services by category, schema, and SQL object type; validate metadata.
    tools:
      - list_services_by_category
      - list_services_by_schema
      - list_services_by_sql_object_type

  sysadmin_search:
    title: Sys Admin Search
    description: Search capabilities for service names and example usage.
    tools:
      - search_services_by_name
      - where_is_service
      - search_examples_for_keyword
      - get_service_example
