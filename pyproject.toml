[project]
name = "ibmi-agentos-docker"
version = "0.1.0"
description = "Starter template for building IBM i agents on Agno AgentOS (Docker)."
requires-python = ">=3.12,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "IBM i AgentOS" }]

dependencies = [
  "agno[os]==2.6.20",
  "anthropic",
  "fastapi[standard]",
  "mcp",
  "openai",
  "pgvector",
  "psycopg[binary]",
  "python-dotenv",
  "pyyaml",
  "sqlalchemy",
]

[project.optional-dependencies]
dev = ["mypy", "ruff"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*"]

[tool.ruff]
line-length = 120
exclude = [".venv*"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
exclude = [".venv*"]

[[tool.mypy.overrides]]
module = ["agno.*", "mcp.*", "sqlalchemy.*", "fastapi.*", "yaml.*", "dotenv.*"]
ignore_missing_imports = true

[tool.uv.pip]
no-annotate = true
